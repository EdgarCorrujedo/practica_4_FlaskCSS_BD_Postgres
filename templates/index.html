<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica 04 - Registro con Postgres</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f4f9; }
        .container { max-width: 500px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        label { font-weight: bold; display: block; margin-top: 10px; }
        input[type="text"], select { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
        .checkbox-group, .radio-group { margin-top: 5px; }
        button { background-color: #28a745; color: white; border: none; padding: 10px 15px; width: 100%; margin-top: 20px; font-size: 16px; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>

<div class="container">
    <h2>Práctica 04: Registro de Alumnos</h2>
    <form action="/guardar" method="POST">
        <!-- Campo Texto: Nombre -->
        <label for="nombre">Nombre completo:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" required>

        <!-- Campo Texto: Control -->
        <label for="control">Número de Control:</label>
        <input type="text" id="control" name="control" placeholder="Ej. 20040123" required>

        <!-- SELECT: Carrera -->
        <label for="carrera">Carrera:</label>
        <select id="carrera" name="carrera" required>
            <option value="">-- Selecciona una opción --</option>
            <option value="Sistemas Computacionales">Sistemas Computacionales</option>
            <option value="Industrial">Ingeniería Industrial</option>
            <option value="Mecatrónica">Ingeniería Mecatrónica</option>
            <option value="Administración">Licenciatura en Administración</option>
        </select>

        <!-- RADIO BUTTONS: Turno -->
        <label>Turno:</label>
        <div class="radio-group">
            <input type="radio" id="matutino" name="turno" value="Matutino" required>
            <label for="matutino" style="display:inline; font-weight:normal;">Matutino</label><br>
            <input type="radio" id="vespertino" name="turno" value="Vespertino">
            <label for="vespertino" style="display:inline; font-weight:normal;">Vespertino</label>
        </div>

        <!-- CHECKBOXES: Pasatiempos -->
        <label>Pasatiempos / Intereses:</label>
        <div class="checkbox-group">
            <input type="checkbox" id="deportes" name="pasatiempos" value="Deportes">
            <label for="deportes" style="display:inline; font-weight:normal;">Deportes</label><br>
            <input type="checkbox" id="lectura" name="pasatiempos" value="Lectura">
            <label for="lectura" style="display:inline; font-weight:normal;">Lectura</label><br>
            <input type="checkbox" id="programacion" name="pasatiempos" value="Programación">
            <label for="programacion" style="display:inline; font-weight:normal;">Programación</label>
        </div>

        <button type="submit">Guardar Datos en Postgres</button>
    </form>
</div>

</body>
</html>
