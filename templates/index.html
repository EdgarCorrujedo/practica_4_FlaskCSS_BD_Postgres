<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Alumnos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>

<div class="container">
    <h2>Registro de Alumnos</h2>
    <form action="/guardar" method="POST">
        
        <div class="form-grid">
            <!-- Columna Izquierda -->
            <div class="form-column">
                <!-- Nombre -->
                <div class="field-group">
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" required>
                </div>

                <!-- Control -->
                <div class="field-group">
                    <label for="control">Número de Control:</label>
                    <input type="text" id="control" name="control" placeholder="Ej. 20040123" required>
                </div>

                <!-- Fecha de Nacimiento -->
                <div class="field-group">
                    <label for="fecha_nacimiento">Fecha de Nacimiento:</label>
                    <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
                </div>

                <!-- Carrera -->
                <div class="field-group">
                    <label for="carrera">Carrera:</label>
                    <select id="carrera" name="carrera" required>
                        <option value="">-- Selecciona una opción --</option>
                        <option value="Sistemas Computacionales">Sistemas Computacionales</option>
                        <option value="Industrial">Ingeniería Industrial</option>
                        <option value="Mecatrónica">Ingeniería Mecatrónica</option>
                        <option value="Administración">Licenciatura en Administración</option>
                    </select>
                </div>

                <!-- Turno -->
                <div class="field-group">
                    <label>Turno:</label>
                    <div class="radio-group inline-options">
                        <input type="radio" id="matutino" name="turno" value="Matutino" required>
                        <label for="matutino">Matutino</label>
                        <input type="radio" id="vespertino" name="turno" value="Vespertino">
                        <label for="vespertino">Vespertino</label>
                    </div>
                </div>
            </div>

            <!-- Columna Derecha -->
            <div class="form-column">
                <!-- Deportes -->
                <div class="field-group">
                    <label>Deportes (Selecciona 1 o varios):</label>
                    <div class="checkbox-group">
                        <input type="checkbox" id="fútbol" name="deportes" value="Fútbol">
                        <label for="fútbol">Fútbol</label><br>
                        <input type="checkbox" id="básquetbol" name="deportes" value="Básquetbol">
                        <label for="básquetbol">Básquetbol</label><br>
                        <input type="checkbox" id="natación" name="deportes" value="Natación">
                        <label for="natación">Natación</label><br>
                        <input type="checkbox" id="voleibol" name="deportes" value="Voleibol">
                        <label for="voleibol">Voleibol</label><br>
                        <input type="checkbox" id="atletismo" name="deportes" value="Atletismo">
                        <label for="atletismo">Atletismo</label>
                    </div>
                </div>

                <!-- Pasatiempos / Intereses -->
                <div class="field-group">
                    <label>Pasatiempos / Intereses (Selecciona 1 o varios):</label>
                    <div class="checkbox-group">
                        <input type="checkbox" id="lectura" name="pasatiempos" value="Lectura">
                        <label for="lectura">Lectura</label><br>
                        <input type="checkbox" id="musica" name="pasatiempos" value="Música">
                        <label for="musica">Música</label><br>
                        <input type="checkbox" id="videojuegos" name="pasatiempos" value="Videojuegos">
                        <label for="videojuegos">Videojuegos</label><br>
                        <input type="checkbox" id="manualidades" name="pasatiempos" value="Manualidades">
                        <label for="manualidades">Manualidades</label><br>
                        <input type="checkbox" id="series" name="pasatiempos" value="series / Películas">
                        <label for="cine">Series / Películas</label>
                    </div>
                </div>
            </div>
        </div>

        <button type="submit">Guardar Datos en Postgres</button>
    </form>
</div>

</body>
</html>
